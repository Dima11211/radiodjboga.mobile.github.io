<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RADIO DJ BOGA | Интернет Радио</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L3147Z3JSN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-L3147Z3JSN');
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #f0f2f5 100%);
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 20px 20px 20px;
            position: relative;
        }

        .logo-image {
            width: 75%;
            max-width: 75%;
            height: auto;
            display: block;
            margin: 5px auto 0 auto;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
        }

        .custom-player {
            background: #03fff7;
            border-radius: 0;
            padding: 0;
            margin-top: 15px;
            margin-bottom: 20px;
            box-shadow: 0 12px 28px rgba(3, 255, 247, 0.2);
            overflow: hidden;
        }

        .button-container {
            display: flex;
            justify-content: center;
            padding: 12px 0 10px 0;
            background: #03fff7;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
        }

        .play-stop-btn {
            background: linear-gradient(135deg, #8b0000, #5a0000);
            border: none;
            width: 180px;
            padding: 10px 0;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.4);
            gap: 10px;
            letter-spacing: 1px;
        }

        .play-stop-btn:active {
            transform: scale(0.97);
        }

        .visualizer-container {
            background: rgba(0, 0, 0, 0.15);
            padding: 20px 16px 24px 16px;
        }

        canvas {
            width: 100%;
            height: 180px;
            display: block;
            background: rgba(0, 0, 0, 0.2);
        }

        .status-text {
            text-align: center;
            margin-top: 10px;
            font-size: 0.75rem;
            color: #1a1a2e;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .mobile-container {
                padding: 8px 16px 16px 16px;
            }
            .logo-image {
                width: 70%;
            }
            .play-stop-btn {
                width: 160px;
                padding: 8px 0;
                font-size: 1.2rem;
            }
            .button-container {
                padding: 10px 0 8px 0;
            }
            .visualizer-container {
                padding: 16px 12px 20px 12px;
            }
            canvas {
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <img src="img/20260225_2221_image.png" alt="RADIO DJ BOGA" class="logo-image">

        <div class="custom-player">
            <div class="button-container">
                <button class="play-stop-btn" id="playStopBtn">▶ PLAY</button>
            </div>
            <div class="visualizer-container">
                <canvas id="visualizerCanvas" width="800" height="180"></canvas>
            </div>
        </div>
        
        <div class="status-text" id="statusText">Готов к воспроизведению</div>
        <main class="content"></main>
    </div>

    <script>
        // ============================================================
        // ⭐⭐⭐ НАСТРОЙКИ ВАШЕГО РАДИО (ТОЛЬКО ЗДЕСЬ) ⭐⭐⭐
        // ============================================================
        const RADIO_STREAM_URL = "http://188.134.73.163:8000/stream";  // ← ВСТАВЬТЕ СВОЙ URL!
        // Пример: const RADIO_STREAM_URL = "http://192.168.1.100:8000/radio.mp3";
        // ============================================================
        
        // DOM элементы
        const playStopBtn = document.getElementById('playStopBtn');
        const statusSpan = document.getElementById('statusText');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        
        // Аудио-переменные
        let audioElement = null;
        let audioContext = null;
        let sourceNode = null;
        let analyserNode = null;
        let gainNode = null;
        let animationId = null;
        let isPlaying = false;
        
        // Размеры canvas
        let canvasWidth = 800, canvasHeight = 180;
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const width = container.clientWidth - 32;
            canvas.width = width;
            canvas.height = 180;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
            if (analyserNode) {
                const bufferLength = analyserNode.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
        }
        window.addEventListener('resize', () => setTimeout(resizeCanvas, 100));
        
        function updateStatus(msg, isError = false) {
            statusSpan.textContent = msg;
            statusSpan.style.color = isError ? '#e74c3c' : '#1a1a2e';
        }
        
        // Полная остановка и очистка
        async function fullStop() {
            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
            }
            if (audioContext && audioContext.state !== 'closed') {
                if (animationId) cancelAnimationFrame(animationId);
                try { await audioContext.close(); } catch(e) {}
                audioContext = null;
                analyserNode = null;
            }
            isPlaying = false;
            playStopBtn.innerHTML = '▶ PLAY';
            updateStatus('Остановлено');
        }
        
        // Инициализация Web Audio (после создания audioElement)
        async function initWebAudio() {
            if (!audioElement) return false;
            if (audioContext && audioContext.state !== 'closed') {
                if (animationId) cancelAnimationFrame(animationId);
                try { await audioContext.close(); } catch(e) {}
            }
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioContext.createMediaElementSource(audioElement);
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 128;
                analyserNode.smoothingTimeConstant = 0.7;
                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.8;
                
                sourceNode.connect(analyserNode);
                analyserNode.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                const bufferLength = analyserNode.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                startVisualization();
                return true;
            } catch(e) {
                console.error("WebAudio error", e);
                return false;
            }
        }
        
        let dataArray = null;
        function startVisualization() {
            if (animationId) cancelAnimationFrame(animationId);
            function draw() {
                if (!analyserNode || !ctx) {
                    animationId = requestAnimationFrame(draw);
                    return;
                }
                if (dataArray) analyserNode.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                const barCount = analyserNode.frequencyBinCount;
                const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
                grad.addColorStop(0, '#ffaa33');
                grad.addColorStop(0.5, '#ff8c00');
                grad.addColorStop(1, '#ff6b00');
                for (let i = 0; i < barCount; i++) {
                    let val = dataArray[i] || 0;
                    let percent = val / 255;
                    let h = Math.max(4, percent * canvasHeight * 0.85);
                    let x = i * (canvasWidth / barCount);
                    let w = (canvasWidth / barCount) * 0.8;
                    ctx.fillStyle = grad;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#ff8c00';
                    ctx.fillRect(x + 2, canvasHeight - h, w - 1, h);
                }
                ctx.shadowBlur = 0;
                animationId = requestAnimationFrame(draw);
            }
            draw();
        }
        
        // Загрузка потока (возвращает Promise, который разрешается после готовности)
        function loadRadioStream(url) {
            return new Promise((resolve, reject) => {
                if (!url || url.trim() === '') {
                    reject(new Error('URL не указан'));
                    return;
                }
                // Очистка старого
                if (audioElement) {
                    audioElement.pause();
                    audioElement.src = '';
                }
                if (audioContext && audioContext.state !== 'closed') {
                    if (animationId) cancelAnimationFrame(animationId);
                    audioContext.close().catch(()=>{});
                    audioContext = null;
                    analyserNode = null;
                }
                
                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                audio.src = url;
                audio.preload = 'auto';
                
                let resolved = false;
                const onCanPlay = async () => {
                    if (resolved) return;
                    resolved = true;
                    audioElement = audio;
                    await initWebAudio();
                    resolve();
                };
                const onError = (e) => {
                    if (resolved) return;
                    resolved = true;
                    reject(new Error(`Ошибка загрузки: ${audio.error ? audio.error.message : 'неизвестная'}`));
                };
                audio.addEventListener('canplay', onCanPlay);
                audio.addEventListener('error', onError);
                // Таймаут на всякий случай
                setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        reject(new Error('Таймаут загрузки потока'));
                    }
                }, 15000);
                
                audioElement = audio; // временно, чтобы можно было прервать
            });
        }
        
        // Воспроизведение (с предварительной загрузкой, если надо)
        async function startPlayback() {
            try {
                // Если нет аудиоэлемента или его src пуст, загружаем поток
                if (!audioElement || !audioElement.src || audioElement.src === '') {
                    updateStatus('Загрузка потока...');
                    await loadRadioStream(RADIO_STREAM_URL);
                }
                // Проверка, что audioElement создан и готов
                if (!audioElement) throw new Error('Не удалось создать аудио');
                
                if (audioContext && audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                await audioElement.play();
                isPlaying = true;
                playStopBtn.innerHTML = '⏹ STOP';
                updateStatus('▶ В эфире');
            } catch (err) {
                console.error(err);
                updateStatus(`Ошибка: ${err.message}`, true);
                isPlaying = false;
                playStopBtn.innerHTML = '▶ PLAY';
                // Сбрасываем аудио, чтобы при следующем нажатии попробовать снова
                if (audioElement) {
                    audioElement.pause();
                    audioElement.src = '';
                }
                audioElement = null;
            }
        }
        
        // Остановка
        function stopPlayback() {
            if (audioElement) {
                audioElement.pause();
            }
            isPlaying = false;
            playStopBtn.innerHTML = '▶ PLAY';
            updateStatus('Остановлено');
        }
        
        // Обработчик кнопки
        async function onPlayStopClick() {
            if (isPlaying) {
                stopPlayback();
            } else {
                await startPlayback();
            }
        }
        
        // Демо-визуализация, если нет реального анализатора
        function demoVisualization() {
            if (!analyserNode && (!audioElement || !audioElement.src)) {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                const barCount = 64;
                const time = Date.now() * 0.005;
                for (let i = 0; i < barCount; i++) {
                    let fake = 25 + Math.sin(time + i * 0.2) * 18;
                    fake = Math.min(canvasHeight * 0.5, Math.max(6, fake));
                    const x = i * (canvasWidth / barCount);
                    const w = (canvasWidth / barCount) * 0.75;
                    ctx.fillStyle = `rgba(255, 140, 0, ${0.6 + Math.sin(time + i) * 0.2})`;
                    ctx.fillRect(x + 2, canvasHeight - fake, w, fake);
                }
                requestAnimationFrame(() => demoVisualization());
            }
        }
        
        function init() {
            resizeCanvas();
            playStopBtn.addEventListener('click', onPlayStopClick);
            // Для возобновления AudioContext при клике
            playStopBtn.addEventListener('click', async () => {
                if (audioContext && audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
            });
            demoVisualization();
            updateStatus('Готов к воспроизведению');
        }
        
        init();
        
        window.addEventListener('beforeunload', () => {
            if (audioElement) audioElement.pause();
            if (audioContext) audioContext.close();
        });
    </script>
</body>
</html>
