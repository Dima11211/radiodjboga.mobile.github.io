<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Мобильная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Логотип */
        .logo-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            display: block;
            margin: 20px auto; /* Центрирование */
        }

        /* Контейнер плеера - ИСПРАВЛЕНО */
        .player-container {
            width: 100%;
            max-width: 480px;
            margin: 20px auto;
            padding: 0 10px;
            background-color: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Адаптация плеера */
        .cstrEmbed {
            width: 100% !important;
            max-width: 100% !important;
        }

        .mobile-header {
            width: 100%;
            height: 56px;
            background-color: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .content {
            width: 100%;
            min-height: 200px;
            background-color: transparent;
        }

        .bottom-nav {
            width: 100%;
            height: 64px;
            background-color: #f8f9fa;
            border-radius: 20px 20px 0 0;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Логотип (исправлен) -->
        <img src="img/20260225_2221_image.png" 
             alt="RADIO DJ BOGA" 
             class="logo-image">

        <!-- Шапка -->
        <header class="mobile-header"></header>

        <!-- Контейнер плеера (исправлен) -->
        <div class="player-container">
            <div data-type="newStreamPlayer"
                 data-publicToken="7cb75f5e-9e0a-4716-b67f-7e4940ba6987"
                 data-theme="light"
                 data-color="e81e4d"
                 data-channelId=""
                 data-rendered="false"
                 class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
            <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
        </div>

        <!-- Контент -->
        <main class="content">
            <div class="touch-area">
                <!-- Здесь контент -->
            </div>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav"></nav>
    </div>

    <script>
        console.log('Мобильная версия исправлена');
    </script>
</body>
</html>
