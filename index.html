<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильная версия</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L3147Z3JSN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());

        gtag('config', 'G-L3147Z3JSN');
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
        }


        .logo-image {
            width: 100%;
            max-width: 330px;
            height: auto;
            display: block;
            margin: 0 auto 10px;
            position: fixed;
            z-index: 10;
            transform: translateY(-5px);
        }

        .player-wrapper {
            position: fixed;
            z-index: 5;
            margin-top: -240px; /* Опустили на 120px вниз (было -230px) */
        }

        .cstrEmbed iframe {
            width: 100% !important;
            border: none !important;
            background: transparent;
        }

        .player-poster, .poster_container, #albumart, .cover-art-wrapper {
            display: none !important;
        }

        .content {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Логотип (поднят на 35px) -->
        <img src="img/20260225_2221_image.png" 
             alt="RADIO DJ BOGA" 
             class="logo-image">

        <!-- Плеер (опущен на 120px) -->
        <div class="player-wrapper">
            <div data-type="newStreamPlayer"
                 data-publicToken="7cb75f5e-9e0a-4716-b67f-7e4940ba6987"
                 data-theme="light"
                 data-color="e81e4d"
                 data-channelId=""
                 data-rendered="false"
                 class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
        </div>

        <main class="content">
            <!-- Здесь будет твой контент -->
        </main>
    </div>

    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
</body>
</html>
