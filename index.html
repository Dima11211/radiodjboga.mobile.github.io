<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Логотип */
        .logo-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            display: block;
            margin: 20px auto;
        }

        /* Контейнер плеера */
        .player-container {
            width: 100%;
            margin: 20px 0;
            background-color: transparent; /* Прозрачный фон */
            border-radius: 12px;
            overflow: hidden;
        }

        .cstrEmbed iframe {
            width: 100% !important;
            border: none !important;
        }

        /* Контент (пустой, готовый к наполнению) */
        .content {
            width: 100%;
            min-height: 100px;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Только логотип -->
        <img src="img/20260225_2221_image.png" 
             alt="RADIO DJ BOGA" 
             class="logo-image">

        <!-- Только плеер (без лишних обводок) -->
        <div class="player-container">
            <div data-type="newStreamPlayer"
                 data-publicToken="7cb75f5e-9e0a-4716-b67f-7e4940ba6987"
                 data-theme="light"
                 data-color="e81e4d"
                 data-channelId=""
                 data-rendered="false"
                 class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
        </div>

        <!-- Контент (пустой, но без серых заглушек) -->
        <main class="content">
            <!-- Здесь будет ваш контент -->
        </main>
    </div>

    <!-- Скрипт плеера -->
    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
</body>
</html>
