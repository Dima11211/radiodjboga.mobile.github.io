<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
        }

        /* Логотип */
        .logo-image {
            width: 100%;
            max-width: 330px;
            height: auto;
            display: block;
            margin: 0 auto 10px;
            position: relative;
            z-index: 10;
            transform: translateY(0);
        }

        /* Контейнер для плеера — наложение под логотип */
        .player-wrapper {
            position: relative;
            z-index: 5;
            margin-top: -230px; /* Поднимаем плеер под логотип */
        }

        /* Плеер без фона */
        .cstrEmbed iframe {
            width: 100% !important;
            border: none !important;
            background: transparent;
        }

        /* Скрываем лишние элементы плеера, если возможно */
        .player-poster, .poster_container, #albumart, .cover-art-wrapper {
            display: none !important;
        }

        .content {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Логотип (виден сверху) -->
        <img src="img/20260225_2221_image.png" 
             alt="RADIO DJ BOGA" 
             class="logo-image">

        <!-- Плеер поднимается вверх под логотип -->
        <div class="player-wrapper">
            <div data-type="newStreamPlayer"
                 data-publicToken="7cb75f5e-9e0a-4716-b67f-7e4940ba6987"
                 data-theme="light"
                 data-color="e81e4d"
                 data-channelId=""
                 data-rendered="false"
                 class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
        </div>

        <main class="content">
            <!-- Здесь будет твой контент -->
        </main>
    </div>

    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
</body>
</html>
