<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильная версия</title>
    <style>
        /* Только самое необходимое */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
        }
            /* Скрываем блок с обложкой/логотипом */
        .player-poster, .poster_container, #albumart, .cover-art-wrapper { 
            display: none !important; 
        }

        /* Принудительно уменьшаем высоту всего плеера до полоски */
        .casterfm-player, #player-container {
            height: auto !important;
            min-height: 50px !important;
        }
        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Только логотип */
        .logo-image {
            transform: translateY(-25px);
            width: 100%;
            max-width: 330px;
            height: auto;
            display: block;
            margin: 20px auto;
        }

        


        }
        /* Только плеер (без фона) */
        .player-container {
            width: 100%;
            margin: 20px 0;
            /* НЕТ background-color */
            /* НЕТ border */
            /* НЕТ height */
        }

        .cstrEmbed iframe {
            width: 100% !important;
            border: none !important;
        }

        /* Контент (абсолютно пустой) */
        .content {
            width: 100%;
            /* НЕТ min-height */
            /* НЕТ background-color */
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- ТОЛЬКО логотип -->
        <img src="img/20260225_2221_image.png" 
             alt="RADIO DJ BOGA" 
             class="logo-image">


        <!-- Оберните ваш код плеера в этот div -->
        <div class="player-wrapper">
            <div data-type="newStreamPlayer"
                 data-publicToken="7cb75f5e-9e0a-4716-b67f-7e4940ba6987"
                 data-theme="light"
                 data-color="e81e4d"
                 data-channelId=""
                 data-rendered="false"
                 class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
        </div>

        <!-- ПУСТОЙ контент (без цветов и контуров) -->
        <main class="content">
            <!-- Здесь ничего нет - абсолютно пусто -->
        </main>
    </div>

    <!-- Скрипт плеера -->
    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
</body>
</html>
