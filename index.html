<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            flex: 1;
        }

        /* Логотип — всегда на одном уровне от верха */
        .logo-image {
            width: 100%;
            max-width: 330px;
            height: auto;
            display: block;
            margin: 5vh auto 0;   /* 5% высоты экрана */
            position: relative;
            z-index: 10;
        }

        /* Плеер — поднимаем ровно на столько, чтобы наложить */
        .player-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            margin-top: -10vh;     /* Подъём пропорционально экрану */
            transform: translateY(-20px); /* Точная доводка пикселями */
        }

        /* 🔧 Масштабирование самого плеера под размер экрана */
        .cstrEmbed {
            display: block;
            transform-origin: top center;
            transform: scale(1); /* По умолчанию 100% */
        }

        /* Маленькие экраны (iPhone SE, 320–375px) — чуть уменьшаем */
        @media (max-width: 375px) and (max-height: 670px) {
            .player-wrapper {
                margin-top: -9vh;
                transform: translateY(-15px);
            }
            .cstrEmbed {
                transform: scale(0.92); /* Уменьшаем сам плеер */
            }
        }

        /* Средние экраны (обычные телефоны) */
        @media (min-width: 376px) and (max-width: 430px) and (min-height: 700px) {
            .player-wrapper {
                margin-top: -10vh;
                transform: translateY(-20px);
            }
            .cstrEmbed {
                transform: scale(1);
            }
        }

        /* Большие экраны (например, планшеты или крупные телефоны) */
        @media (min-width: 431px) and (min-height: 800px) {
            .player-wrapper {
                margin-top: -11vh;
                transform: translateY(-25px);
            }
            .cstrEmbed {
                transform: scale(1.05); /* Чуть увеличиваем плеер */
            }
        }

        /* Плеер без фона */
        .cstrEmbed iframe {
            width: 100% !important;
            border: none !important;
            background: transparent;
        }

        /* Скрываем лишнее */
        .player-poster, .poster_container, #albumart, .cover-art-wrapper {
            display: none !important;
        }

        .content {
            width: 100%;
            margin-top: 2vh;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <img src="img/20260225_2221_image.png" 
             alt="RADIO DJ BOGA" 
             class="logo-image">

        <div class="player-wrapper">
            <div data-type="newStreamPlayer"
                 data-publicToken="7cb75f5e-9e0a-4716-b67f-7e4940ba6987"
                 data-theme="light"
                 data-color="e81e4d"
                 data-channelId=""
                 data-rendered="false"
                 class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
        </div>

        <main class="content"></main>
    </div>

    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
</body>
</html>
