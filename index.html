<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Логотип — центрирован и адаптивен */
        .logo-image {
            width: 100%;
            max-width: min(330px, 80vw); /* Адаптивная ширина */
            height: auto;
            display: block;
            margin: 5vh auto 0; /* Отступ сверху в % от высоты экрана */
            position: relative;
            z-index: 10;
        }

        /* Контейнер для плеера — адаптивный подъём */
        .player-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            margin-top: 0; /* Сбрасываем */
            transform: translateY(0);
        }

        /* === ТОЧНАЯ НАСТРОЙКА ПОД РАЗНЫЕ ЭКРАНЫ === */
        
        /* Маленькие экраны (iPhone SE, 320px, высота ~670px) */
        @media (max-height: 700px) {
            .player-wrapper {
                margin-top: -100px;
            }
        }

        /* Средние экраны (Samsung A35, высота ~800-900px) */
        @media (min-height: 701px) and (max-height: 950px) {
            .player-wrapper {
                margin-top: -140px;
            }
        }

        /* Большие экраны (планшеты, крупные телефоны) */
        @media (min-height: 951px) {
            .player-wrapper {
                margin-top: -180px;
            }
        }

        /* Samsung A35 и аналоги (специфичная настройка) */
        @media (min-width: 380px) and (max-width: 420px) and (min-height: 800px) and (max-height: 950px) {
            .player-wrapper {
                margin-top: -150px; /* Точная подстройка под A35 */
            }
        }

        /* Плеер без фона */
        .cstrEmbed iframe {
            width: 100% !important;
            border: none !important;
            background: transparent;
        }

        /* Скрываем лишние элементы плеера */
        .player-poster, .poster_container, #albumart, .cover-art-wrapper,
        [class*="poster"], [class*="cover"], [class*="album"] {
            display: none !important;
        }

        /* Контент */
        .content {
            width: 100%;
            margin-top: 20px;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Логотип -->
        <img src="img/20260225_2221_image.png" 
             alt="RADIO DJ BOGA" 
             class="logo-image">

        <!-- Плеер -->
        <div class="player-wrapper">
            <div data-type="newStreamPlayer"
                 data-publicToken="7cb75f5e-9e0a-4716-b67f-7e4940ba6987"
                 data-theme="light"
                 data-color="e81e4d"
                 data-channelId=""
                 data-rendered="false"
                 class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
        </div>

        <main class="content">
            <!-- Здесь будет контент -->
        </main>
    </div>

    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
    
    <script>
        // Дополнительная корректировка после загрузки
        window.addEventListener('load', function() {
            console.log('Страница загружена, устройство: ' + window.innerHeight + 'px');
            
            // Если нужно точно подогнать под конкретное устройство
            if (window.innerHeight < 700) {
                document.querySelector('.player-wrapper').style.marginTop = '-100px';
            } else if (window.innerHeight < 950) {
                document.querySelector('.player-wrapper').style.marginTop = '-140px';
            } else {
                document.querySelector('.player-wrapper').style.marginTop = '-180px';
            }
        });
    </script>
</body>
</html>
