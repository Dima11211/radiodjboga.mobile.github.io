<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RADIO DJ BOGA | Интернет Радио</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #f0f2f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }
        .logo {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
        }
        .player {
            background: #03fff7;
            box-shadow: 0 12px 28px rgba(3, 255, 247, 0.3);
            margin-bottom: 20px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            padding: 12px 0;
            background: #03fff7;
            border-bottom: 2px solid rgba(255,255,255,0.6);
        }
        .play-btn {
            background: linear-gradient(135deg, #8b0000, #5a0000);
            border: none;
            width: 180px;
            padding: 12px 0;
            border-radius: 50px;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 6px 16px rgba(139,0,0,0.4);
        }
        .play-btn:active { transform: scale(0.96); }
        .viz-container {
            background: rgba(0,0,0,0.15);
            padding: 20px;
        }
        canvas {
            width: 100%;
            height: 180px;
            display: block;
            background: rgba(0,0,0,0.2);
        }
        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1a1a2e;
        }
        @media (max-width: 480px) {
            .play-btn { width: 160px; padding: 10px 0; font-size: 1.2rem; }
            canvas { height: 150px; }
        }
    </style>
</head>
<body>
<div class="container">
    <img src="img/20260225_2221_image.png" alt="RADIO DJ BOGA" class="logo">
    <div class="player">
        <div class="btn-container">
            <button class="play-btn" id="playPauseBtn">▶ PLAY</button>
        </div>
        <div class="viz-container">
            <canvas id="audioCanvas" width="800" height="180"></canvas>
        </div>
    </div>
    <div class="status" id="statusMsg">Готов к воспроизведению</div>
</div>

<script>
    // ==============================================================
    // ⚡ НАСТРОЙКИ - МЕНЯЙТЕ ТОЛЬКО ЗДЕСЬ ⚡
    // ==============================================================
    const STREAM_URL = "http://188.134.73.163:8000/stream";  // Ваш URL (http или https)
    // ==============================================================

    // --- 1. Решение проблемы смешанного контента (Mixed Content) ---
    // Если сайт открыт по HTTPS, а поток по HTTP - браузер заблокирует.
    // Этот прокси-сервер безопасно передает HTTP-поток на HTTPS-страницу.
    function getActualUrl() {
        if (window.location.protocol === 'https:' && STREAM_URL.startsWith('http:')) {
            // Используем публичный CORS-прокси для обхода блокировки
            return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(STREAM_URL);
        }
        return STREAM_URL;
    }

    // --- DOM элементы ---
    const playBtn = document.getElementById('playPauseBtn');
    const canvas = document.getElementById('audioCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('statusMsg');

    // --- Переменные плеера ---
    let audio = null;
    let audioCtx = null;
    let analyser = null;
    let source = null;
    let animationId = null;
    let isPlaying = false;

    // --- Настройка canvas ---
    let width = 800, height = 180;
    function resizeCanvas() {
        const w = canvas.parentElement.clientWidth - 40;
        canvas.width = w;
        canvas.height = 180;
        width = canvas.width;
        height = canvas.height;
    }
    window.addEventListener('resize', () => setTimeout(resizeCanvas, 100));
    resizeCanvas();

    // --- Обновление статуса ---
    function setStatus(msg, isError = false) {
        statusDiv.textContent = msg;
        statusDiv.style.color = isError ? '#e74c3c' : '#1a1a2e';
        console.log(msg);
    }

    // --- Визуализация (эквалайзер) ---
    let dataArray = null;
    function startVisualization() {
        if (!analyser) return;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        
        function draw() {
            if (!analyser || !ctx) {
                animationId = requestAnimationFrame(draw);
                return;
            }
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, width, height);
            const barCount = analyser.frequencyBinCount;
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#ffaa33');
            grad.addColorStop(0.5, '#ff8c00');
            grad.addColorStop(1, '#ff6b00');
            for (let i = 0; i < barCount; i++) {
                let val = dataArray[i] || 0;
                let percent = val / 255;
                let barHeight = Math.max(4, percent * height * 0.85);
                let x = i * (width / barCount);
                let w = (width / barCount) * 0.8;
                ctx.fillStyle = grad;
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ff8c00';
                ctx.fillRect(x + 2, height - barHeight, w - 1, barHeight);
            }
            ctx.shadowBlur = 0;
            animationId = requestAnimationFrame(draw);
        }
        draw();
    }

    // --- Полная остановка и очистка ---
    async function fullStop() {
        if (audio) {
            audio.pause();
            audio.src = '';
            audio = null;
        }
        if (audioCtx) {
            if (animationId) cancelAnimationFrame(animationId);
            try { await audioCtx.close(); } catch(e) {}
            audioCtx = null;
            analyser = null;
            source = null;
        }
        isPlaying = false;
        playBtn.innerHTML = '▶ PLAY';
    }

    // --- Инициализация Web Audio и подключение к аудиоэлементу ---
    async function initWebAudio(element) {
        if (!element) return false;
        if (audioCtx) {
            if (animationId) cancelAnimationFrame(animationId);
            try { await audioCtx.close(); } catch(e) {}
            audioCtx = null;
        }
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaElementSource(element);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 128;
            analyser.smoothingTimeConstant = 0.7;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.8;
            source.connect(analyser);
            analyser.connect(gain);
            gain.connect(audioCtx.destination);
            startVisualization();
            return true;
        } catch(e) {
            console.error("WebAudio init error", e);
            return false;
        }
    }

    // --- Запуск воспроизведения ---
    async function startPlayback() {
        try {
            setStatus('Подключение к потоку...');
            await fullStop();
            
            const finalUrl = getActualUrl();
            if (finalUrl !== STREAM_URL) {
                setStatus('Обход смешанного контента (HTTPS→HTTP)');
            }
            
            const newAudio = new Audio();
            newAudio.crossOrigin = 'anonymous';
            newAudio.src = finalUrl;
            newAudio.preload = 'auto';
            
            // Ждем готовности
            await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error('Таймаут 10 секунд')), 10000);
                newAudio.addEventListener('canplay', () => { clearTimeout(timeout); resolve(); }, { once: true });
                newAudio.addEventListener('error', (e) => {
                    clearTimeout(timeout);
                    let errMsg = 'Ошибка загрузки';
                    if (newAudio.error) {
                        if (newAudio.error.code === 2) errMsg = 'Сервер не отвечает (поток недоступен)';
                        else if (newAudio.error.code === 4) errMsg = 'URL не найден';
                    }
                    reject(new Error(errMsg));
                }, { once: true });
                newAudio.load();
            });
            
            audio = newAudio;
            const ok = await initWebAudio(audio);
            if (!ok) throw new Error('Не удалось настроить аудио');
            
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
            await audio.play();
            isPlaying = true;
            playBtn.innerHTML = '⏹ STOP';
            setStatus('▶ В эфире');
        } catch(err) {
            console.error(err);
            setStatus('Ошибка: ' + err.message, true);
            isPlaying = false;
            playBtn.innerHTML = '▶ PLAY';
            if (audio) { audio.pause(); audio.src = ''; audio = null; }
        }
    }

    // --- Остановка ---
    function stopPlayback() {
        if (audio) audio.pause();
        isPlaying = false;
        playBtn.innerHTML = '▶ PLAY';
        setStatus('Остановлено');
    }

    // --- Обработчик кнопки ---
    async function onPlayClick() {
        if (isPlaying) {
            stopPlayback();
        } else {
            await startPlayback();
        }
    }

    // --- Демо-визуализация (красивая заглушка, если нет звука) ---
    function demoVisualization() {
        if (!analyser && (!audio || !audio.src)) {
            ctx.clearRect(0, 0, width, height);
            const bars = 64;
            const time = Date.now() * 0.005;
            for (let i = 0; i < bars; i++) {
                let h = 20 + Math.sin(time + i * 0.2) * 18;
                h = Math.min(height * 0.5, Math.max(6, h));
                const x = i * (width / bars);
                const w = (width / bars) * 0.7;
                ctx.fillStyle = `rgba(255, 140, 0, ${0.5 + Math.sin(time + i) * 0.2})`;
                ctx.fillRect(x + 2, height - h, w, h);
            }
            requestAnimationFrame(() => demoVisualization());
        }
    }

    // --- Запуск ---
    playBtn.addEventListener('click', onPlayClick);
    demoVisualization();
    setStatus('Нажмите PLAY');
    
    window.addEventListener('beforeunload', () => {
        if (audio) audio.pause();
        if (audioCtx) audioCtx.close();
    });
</script>
</body>
</html>
