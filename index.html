<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RADIO DJ BOGA | Интернет Радио</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L3147Z3JSN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-L3147Z3JSN');
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #f0f2f5 100%);
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 20px 20px 20px;
            position: relative;
        }

        .logo-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 5px 0 0 0;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
        }

        .custom-player {
            background: #03fff7;
            border-radius: 0;
            padding: 0;
            margin-top: 15px;
            margin-bottom: 20px;
            box-shadow: 0 12px 28px rgba(3, 255, 247, 0.2);
            overflow: hidden;
        }

        .button-container {
            display: flex;
            justify-content: center;
            padding: 20px 0 20px 0;
            background: #03fff7;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
        }

        .play-stop-btn {
            background: linear-gradient(135deg, #8b0000, #5a0000);
            border: none;
            width: 200px;
            padding: 12px 0;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.4);
            gap: 12px;
            letter-spacing: 1px;
        }

        .play-stop-btn:active {
            transform: scale(0.96);
        }

        .play-stop-btn.playing {
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
        }

        .visualizer-container {
            background: rgba(0, 0, 0, 0.15);
            padding: 20px 16px 24px 16px;
        }

        canvas {
            width: 100%;
            height: 180px;
            display: block;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        @media (max-width: 480px) {
            .mobile-container {
                padding: 8px 16px 16px 16px;
            }
            .play-stop-btn {
                width: 160px;
                padding: 9px 0;
                font-size: 1rem;
            }
            canvas {
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <img src="img/20260225_2221_image.png" alt="RADIO DJ BOGA" class="logo-image">

        <div class="custom-player">
            <div class="button-container">
                <button class="play-stop-btn" id="playStopBtn">
                    <span id="btnIcon">▶</span>
                    <span id="btnText">PLAY</span>
                </button>
            </div>
            <div class="visualizer-container">
                <canvas id="visualizerCanvas" width="800" height="180"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // РЕГИСТРАЦИЯ SERVICE WORKER
        // ============================================================
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.log('Service Worker error:', err));
        }
        
        // ============================================================
        // НАСТРОЙКИ РАДИО
        // ============================================================
        const RADIO_STREAM_URL = "https://radio.radiodjboga.online/stream";
        
        let audioElement = null;
        let audioContext = null;
        let sourceNode = null;
        let analyserNode = null;
        let gainNode = null;
        let animationId = null;
        let isPlaying = false;
        let reconnectAttempt = 0;
        let reconnectTimer = null;
        
        let dataArray = null;
        let canvasWidth = 800;
        let canvasHeight = 180;
        let prevValues = [];
        
        // DOM элементы
        const playStopBtn = document.getElementById('playStopBtn');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        
        function updateButtonUI(isRadioPlaying) {
            if (isRadioPlaying) {
                btnIcon.innerHTML = '⏹';
                btnText.innerHTML = 'STOP';
                playStopBtn.classList.add('playing');
            } else {
                btnIcon.innerHTML = '▶';
                btnText.innerHTML = 'PLAY';
                playStopBtn.classList.remove('playing');
            }
        }
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const width = container.clientWidth - 32;
            canvas.width = width;
            canvas.height = 180;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
            if (analyserNode) {
                const bufferLength = analyserNode.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                prevValues = new Array(bufferLength).fill(0);
            }
        }
        
        window.addEventListener('resize', () => setTimeout(resizeCanvas, 100));
        resizeCanvas();
        
        async function initWebAudioForRadio() {
            if (!audioElement) return false;
            
            if (audioContext && audioContext.state !== 'closed') {
                if (animationId) cancelAnimationFrame(animationId);
                try { await audioContext.close(); } catch(e) {}
            }
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioContext.createMediaElementSource(audioElement);
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 256;
                analyserNode.smoothingTimeConstant = 0.7;
                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.8;
                
                sourceNode.connect(analyserNode);
                analyserNode.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                const bufferLength = analyserNode.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                prevValues = new Array(bufferLength).fill(0);
                startVisualization();
                return true;
            } catch (error) {
                console.error("Web Audio ошибка:", error);
                return false;
            }
        }
        
        function getColorForHeight(percent, isPeak = false) {
            let hue;
            if (percent < 0.16) {
                hue = 120 - (percent / 0.16) * 60;
            } else if (percent < 0.33) {
                hue = 60 - ((percent - 0.16) / 0.17) * 30;
            } else if (percent < 0.5) {
                hue = 30 - ((percent - 0.33) / 0.17) * 15;
            } else if (percent < 0.66) {
                hue = 15 - ((percent - 0.5) / 0.16) * 15;
            } else if (percent < 0.83) {
                hue = 0 - ((percent - 0.66) / 0.17) * 60;
                if (hue < 0) hue += 360;
            } else {
                hue = 300 - ((percent - 0.83) / 0.17) * 60;
            }
            if (percent > 0.95) hue = 240;
            let sat = 85;
            let light = 50;
            if (isPeak && percent > 0.8) {
                light = 65;
                sat = 95;
            }
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        }
        
        function startVisualization() {
            if (animationId) cancelAnimationFrame(animationId);
            function draw() {
                if (!analyserNode || !ctx) {
                    animationId = requestAnimationFrame(draw);
                    return;
                }
                if (dataArray) analyserNode.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                
                const barCount = analyserNode.frequencyBinCount;
                const halfBarCount = barCount / 2;
                let maxValue = 0;
                for (let i = 0; i < barCount; i++) {
                    if (dataArray[i] > maxValue) maxValue = dataArray[i];
                }
                if (maxValue < 1) maxValue = 255;
                
                const displayBars = [];
                for (let i = 0; i < barCount; i++) {
                    let distanceFromCenter = Math.abs(i - halfBarCount) / halfBarCount;
                    let frequencyWeight = 1 - distanceFromCenter;
                    let boostedValue = dataArray[i] * (0.5 + frequencyWeight * 0.8);
                    displayBars[i] = Math.min(255, boostedValue);
                }
                
                for (let i = 0; i < barCount; i++) {
                    let value = displayBars[i] || 0;
                    let percent = value / maxValue;
                    let barHeight = Math.max(4, percent * canvasHeight * 0.85);
                    if (prevValues[i]) barHeight = prevValues[i] * 0.6 + barHeight * 0.4;
                    prevValues[i] = barHeight;
                    
                    const x = i * (canvasWidth / barCount);
                    const w = Math.max(6, (canvasWidth / barCount) * 1.6);
                    const isPeak = value > 180;
                    const gradient = ctx.createLinearGradient(x, canvasHeight - barHeight, x, canvasHeight);
                    gradient.addColorStop(0, getColorForHeight(0, false));
                    gradient.addColorStop(0.16, getColorForHeight(0.16, false));
                    gradient.addColorStop(0.33, getColorForHeight(0.33, false));
                    gradient.addColorStop(0.5, getColorForHeight(0.5, false));
                    gradient.addColorStop(0.66, getColorForHeight(0.66, false));
                    gradient.addColorStop(0.83, getColorForHeight(0.83, false));
                    gradient.addColorStop(1, getColorForHeight(1, isPeak));
                    
                    ctx.fillStyle = gradient;
                    ctx.shadowBlur = isPeak ? 10 : 4;
                    ctx.shadowColor = isPeak ? '#ff3300' : '#ff8c00';
                    ctx.fillRect(x + 1, canvasHeight - barHeight, w - 1, barHeight);
                    if (isPeak && barHeight > 15) {
                        ctx.fillStyle = `rgba(100, 100, 255, 0.6)`;
                        ctx.fillRect(x + 1, canvasHeight - barHeight - 2, w - 1, 4);
                    }
                }
                ctx.shadowBlur = 0;
                animationId = requestAnimationFrame(draw);
            }
            draw();
        }
        
        // Функция переподключения БЕЗ вывода сообщений на экран
        function silentReconnect() {
            if (!isPlaying) return;
            
            if (reconnectTimer) clearTimeout(reconnectTimer);
            
            reconnectAttempt++;
            
            // Просто пытаемся переподключиться в фоне, без текста
            if (audioElement) {
                // Пробуем перезагрузить аудио без вывода сообщений
                const currentSrc = audioElement.src;
                if (currentSrc) {
                    audioElement.load();
                    audioElement.play().catch(() => {
                        // Полная перезагрузка потока
                        if (isPlaying) {
                            const newAudio = new Audio();
                            newAudio.crossOrigin = 'anonymous';
                            newAudio.src = RADIO_STREAM_URL;
                            
                            const oldAudio = audioElement;
                            audioElement = newAudio;
                            
                            if (oldAudio) {
                                oldAudio.pause();
                                oldAudio.src = '';
                            }
                            
                            initWebAudioForRadio().then(() => {
                                if (audioContext && audioContext.state === 'suspended') {
                                    audioContext.resume();
                                }
                                audioElement.play().catch(e => console.log('Reconnect play error:', e));
                            });
                        }
                    });
                }
            }
            
            // Если всё ещё не работает, пробуем через 5 секунд (без сообщений)
            reconnectTimer = setTimeout(() => {
                if (isPlaying && audioElement && audioElement.paused) {
                    silentReconnect();
                } else {
                    reconnectAttempt = 0;
                }
            }, 5000);
        }
        
        // ПЕРЕХВАТЫВАЕМ ВСЕ ОШИБКИ И БЛОКИРУЕМ СООБЩЕНИЯ О ПЕРЕПОДКЛЮЧЕНИИ
        function setupSilentErrorHandling() {
            if (!audioElement) return;
            
            // Перехватываем ошибки и тихо переподключаемся
            audioElement.onerror = (e) => {
                console.log('Audio error (silent):', e);
                if (isPlaying) {
                    silentReconnect();
                }
                return false; // Предотвращаем показ стандартной ошибки
            };
            
            audioElement.onstalled = () => {
                console.log('Audio stalled (silent)');
                if (isPlaying) {
                    silentReconnect();
                }
            };
            
            audioElement.onwaiting = () => {
                // Буферизация — ничего не показываем
                console.log('Buffering... (silent)');
            };
            
            // Отключаем стандартные сообщения браузера
            audioElement.setAttribute('x-webkit-airplay', 'deny');
        }
        
        async function startPlayback() {
            try {
                reconnectAttempt = 0;
                if (reconnectTimer) clearTimeout(reconnectTimer);
                
                if (audioElement && !isPlaying) {
                    try {
                        setupSilentErrorHandling();
                        await audioElement.play();
                        isPlaying = true;
                        updateButtonUI(true);
                        return;
                    } catch(e) {
                        console.log('Need to recreate audio');
                    }
                }
                
                if (audioElement) {
                    audioElement.pause();
                    audioElement.src = '';
                    audioElement = null;
                }
                if (audioContext && audioContext.state !== 'closed') {
                    if (animationId) cancelAnimationFrame(animationId);
                    try { await audioContext.close(); } catch(e) {}
                    audioContext = null;
                    analyserNode = null;
                }
                
                const newAudio = new Audio();
                newAudio.crossOrigin = 'anonymous';
                newAudio.src = RADIO_STREAM_URL;
                newAudio.preload = 'auto';
                
                audioElement = newAudio;
                setupSilentErrorHandling();
                
                try {
                    await initWebAudioForRadio();
                    if (audioContext && audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }
                    await audioElement.play();
                    isPlaying = true;
                    updateButtonUI(true);
                } catch (playError) {
                    console.log('Play error:', playError);
                    isPlaying = true;
                    updateButtonUI(true);
                    setTimeout(() => {
                        if (audioElement && isPlaying) {
                            audioElement.play().catch(e => console.log('Retry play:', e));
                        }
                    }, 2000);
                }
                
            } catch (err) {
                console.error('Start error:', err);
                // Тихо переподключаемся
                if (isPlaying) silentReconnect();
            }
        }
        
        function stopPlayback() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            reconnectAttempt = 0;
            
            if (audioElement) {
                try {
                    audioElement.pause();
                } catch(e) {}
            }
            isPlaying = false;
            updateButtonUI(false);
        }
        
        async function togglePlayStop() {
            if (isPlaying) {
                stopPlayback();
            } else {
                await startPlayback();
            }
        }
        
        // Сетевые события — НИКАКИХ СООБЩЕНИЙ НА ЭКРАНЕ
        window.addEventListener('online', function() {
            console.log('Internet back');
            if (isPlaying && audioElement) {
                silentReconnect();
            }
        });
        
        window.addEventListener('offline', function() {
            console.log('Internet lost - radio continues');
            // Ничего не показываем, просто ждём восстановления
        });
        
        // Демо-визуализация (когда радио выключено)
        let demoAnimationId = null;
        function demoVisualization() {
            if (demoAnimationId) cancelAnimationFrame(demoAnimationId);
            function drawDemo() {
                if (analyserNode && isPlaying) {
                    if (demoAnimationId) cancelAnimationFrame(demoAnimationId);
                    return;
                }
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                const barCount = 48;
                const halfBarCount = barCount / 2;
                const time = Date.now() * 0.005;
                for (let i = 0; i < barCount; i++) {
                    let distanceFromCenter = Math.abs(i - halfBarCount) / halfBarCount;
                    let boostFactor = Math.cos(distanceFromCenter * Math.PI / 2);
                    let fake = 20 + Math.sin(time + i * 0.2) * 15;
                    fake = fake * (0.3 + boostFactor * 0.9);
                    fake = Math.min(canvasHeight * 0.6, Math.max(5, fake));
                    const x = i * (canvasWidth / barCount);
                    const w = Math.max(6, (canvasWidth / barCount) * 1.6);
                    const gradient = ctx.createLinearGradient(x, canvasHeight - fake, x, canvasHeight);
                    gradient.addColorStop(0, '#00ff00');
                    gradient.addColorStop(0.25, '#ffff00');
                    gradient.addColorStop(0.5, '#ff8800');
                    gradient.addColorStop(0.75, '#ff0000');
                    gradient.addColorStop(1, '#0000aa');
                    ctx.fillStyle = gradient;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = '#8888ff';
                    ctx.fillRect(x + 1, canvasHeight - fake, w - 1, fake);
                }
                ctx.shadowBlur = 0;
                demoAnimationId = requestAnimationFrame(drawDemo);
            }
            drawDemo();
        }
        
        playStopBtn.addEventListener('click', togglePlayStop);
        demoVisualization();
        
        window.addEventListener('beforeunload', () => {
            if (isPlaying) {
                sessionStorage.setItem('radioWasPlaying', 'true');
            }
            if (reconnectTimer) clearTimeout(reconnectTimer);
            if (audioElement) audioElement.pause();
            if (audioContext) audioContext.close();
            if (animationId) cancelAnimationFrame(animationId);
            if (demoAnimationId) cancelAnimationFrame(demoAnimationId);
        });
        
        if (sessionStorage.getItem('radioWasPlaying') === 'true') {
            sessionStorage.removeItem('radioWasPlaying');
            setTimeout(startPlayback, 500);
        }
        
        if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
                type: 'PLAY_STATE',
                isPlaying: isPlaying
            });
        }
    </script>
</body>
</html>
