<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RADIO DJ BOGA | Интернет Радио</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L3147Z3JSN"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #f0f2f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* Логотип - большой размер */
        .logo-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 0.5cm; /* отступ 0.5см снизу */
            position: relative;
            z-index: 10;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
        }

        /* ========== ПЛЕЕР - без обводки (убрана ширина/рамка) ========== */
        .custom-player {
            background: #03fff7;
            border-radius: 28px;
            padding: 0;
            margin: 0;
            box-shadow: none; /* убрали тень */
            position: relative;
            z-index: 5;
            overflow: hidden;
            border: none; /* убрали рамку */
        }

        /* Контейнер для кнопки - вплотную к эквалайзеру */
        .button-container {
            display: flex;
            justify-content: center;
            padding: 0;
            margin: 0;
            background: #03fff7;
        }

        /* Прямоугольная бордовая кнопка play/stop */
        .play-stop-btn {
            background: linear-gradient(135deg, #8b0000, #5a0000);
            border: none;
            width: 160px;
            padding: 10px 0;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.4);
            gap: 8px;
            letter-spacing: 1px;
            margin: 0;
        }

        .play-stop-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(139, 0, 0, 0.5);
        }

        /* Визуальный эквалайзер - без отступа сверху */
        .visualizer-container {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 0 0 28px 28px;
            padding: 12px;
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: none;
            border-left: none;
            border-right: none;
        }

        canvas {
            width: 100%;
            height: 160px;
            display: block;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        .content {
            margin-top: 20px;
        }

        /* Адаптация под мобильные */
        @media (max-width: 480px) {
            .mobile-container {
                padding: 16px;
            }
            
            .play-stop-btn {
                width: 140px;
                padding: 8px 0;
                font-size: 1.2rem;
            }
            
            canvas {
                height: 140px;
            }
            
            .logo-image {
                margin-bottom: 0.5cm; /* 0.5см отступ */
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Логотип - большой размер -->
        <img src="img/20260225_2221_image.png" 
             alt="RADIO DJ BOGA" 
             class="logo-image">

        <!-- Плеер вплотную под логотипом (отступ 0.5см) без обводки -->
        <div class="custom-player">
            <!-- Кнопка play/stop прижата к эквалайзеру -->
            <div class="button-container">
                <button class="play-stop-btn" id="playStopBtn">▶ PLAY</button>
            </div>

            <!-- Окно с эквалайзером -->
            <div class="visualizer-container">
                <canvas id="visualizerCanvas" width="800" height="160"></canvas>
            </div>
        </div>

        <main class="content">
            <!-- Здесь будет ваш дополнительный контент -->
        </main>
    </div>

    <script>
        // ============================================================
        // НАСТРОЙКИ ВАШЕГО РАДИО ВЕЩАНИЯ
        // ============================================================
        // ВСТАВЬТЕ СЮДА URL ВАШЕГО ПОТОКА (IP:PORT или домен)
        const RADIO_STREAM_URL = "http://your-ip:8000/stream";  // ← ИЗМЕНИТЕ НА ВАШ URL!
        
        // ============================================================
        // КОД ПЛЕЕРА
        // ============================================================
        
        // DOM элементы
        const playStopBtn = document.getElementById('playStopBtn');
        
        // Canvas для визуализации
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        
        // Web Audio переменные
        let audioElement = null;
        let audioContext = null;
        let sourceNode = null;
        let analyserNode = null;
        let gainNode = null;
        let animationId = null;
        let isPlaying = false;
        let currentStreamUrl = RADIO_STREAM_URL;
        
        // Настройки визуализации
        let dataArray = null;
        let canvasWidth = 800;
        let canvasHeight = 160;
        
        // Инициализация canvas размера
        function resizeCanvas() {
            const container = canvas.parentElement;
            const width = container.clientWidth - 24;
            canvas.width = width;
            canvas.height = 160;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
            if (analyserNode) {
                const bufferLength = analyserNode.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
        }
        
        window.addEventListener('resize', () => {
            setTimeout(resizeCanvas, 100);
        });
        
        // Создание Web Audio цепочки
        async function initWebAudioForRadio() {
            if (!audioElement) return false;
            
            if (audioContext && audioContext.state !== 'closed') {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                try {
                    await audioContext.close();
                } catch(e) {}
            }
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioContext.createMediaElementSource(audioElement);
                
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 128;
                analyserNode.smoothingTimeConstant = 0.7;
                
                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.8;
                
                sourceNode.connect(analyserNode);
                analyserNode.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                const bufferLength = analyserNode.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                startVisualization();
                return true;
            } catch (error) {
                console.error("Web Audio ошибка:", error);
                return false;
            }
        }
        
        // Анимация визуализатора - ОРАНЖЕВЫЙ градиент
        function startVisualization() {
            if (animationId) cancelAnimationFrame(animationId);
            
            function draw() {
                if (!analyserNode || !ctx) {
                    animationId = requestAnimationFrame(draw);
                    return;
                }
                
                if (dataArray) {
                    analyserNode.getByteFrequencyData(dataArray);
                } else {
                    animationId = requestAnimationFrame(draw);
                    return;
                }
                
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                
                const barCount = analyserNode.frequencyBinCount;
                // ОРАНЖЕВЫЙ градиент для эквалайзера
                const gradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
                gradient.addColorStop(0, '#ffaa33');
                gradient.addColorStop(0.5, '#ff8c00');
                gradient.addColorStop(1, '#ff6b00');
                
                for (let i = 0; i < barCount; i++) {
                    let value = dataArray[i] || 0;
                    let percent = value / 255;
                    let barHeight = Math.max(3, percent * canvasHeight * 0.85);
                    const x = i * (canvasWidth / barCount);
                    const w = (canvasWidth / barCount) * 0.8;
                    
                    ctx.fillStyle = gradient;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ff8c00';
                    ctx.fillRect(x + 2, canvasHeight - barHeight, w - 1, barHeight);
                }
                ctx.shadowBlur = 0;
                
                animationId = requestAnimationFrame(draw);
            }
            
            draw();
        }
        
        // Загрузка радио потока
        async function loadRadioStream(url) {
            if (!url || url.trim() === '') {
                console.error('URL не указан');
                return false;
            }
            
            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
            }
            
            audioElement = new Audio();
            audioElement.crossOrigin = 'anonymous';
            audioElement.src = url;
            audioElement.preload = 'auto';
            
            currentStreamUrl = url;
            
            audioElement.addEventListener('canplay', async () => {
                await initWebAudioForRadio();
                if (isPlaying) {
                    await audioElement.play().catch(e => console.warn);
                }
            });
            
            audioElement.addEventListener('playing', () => {
                isPlaying = true;
                playStopBtn.innerHTML = '⏹ STOP';
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            });
            
            audioElement.addEventListener('pause', () => {
                if (!audioElement.src) return;
                if (!audioElement.ended) {
                    isPlaying = false;
                    playStopBtn.innerHTML = '▶ PLAY';
                }
            });
            
            audioElement.addEventListener('error', () => {
                isPlaying = false;
                playStopBtn.innerHTML = '▶ PLAY';
                console.error('Ошибка подключения к потоку');
            });
            
            return true;
        }
        
        // Функция play/stop
        async function togglePlayStop() {
            if (!audioElement || !currentStreamUrl) {
                await loadRadioStream(RADIO_STREAM_URL);
                setTimeout(async () => {
                    if (audioElement) {
                        try {
                            await audioElement.play();
                            isPlaying = true;
                            playStopBtn.innerHTML = '⏹ STOP';
                            if (audioContext && audioContext.state === 'suspended') {
                                await audioContext.resume();
                            }
                        } catch (err) {
                            console.log("Автоплей заблокирован:", err);
                        }
                    }
                }, 100);
                return;
            }
            
            if (audioContext && audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            
            if (audioElement.paused) {
                await audioElement.play().catch(e => {
                    console.error("Ошибка воспроизведения", e);
                });
                isPlaying = true;
                playStopBtn.innerHTML = '⏹ STOP';
            } else {
                audioElement.pause();
                isPlaying = false;
                playStopBtn.innerHTML = '▶ PLAY';
            }
        }
        
        // Демо-визуализация при отсутствии потока (оранжевая)
        function demoVisualization() {
            if (!analyserNode && (!audioElement || !audioElement.src)) {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                const barCount = 64;
                const time = Date.now() * 0.005;
                for (let i = 0; i < barCount; i++) {
                    let fake = 20 + Math.sin(time + i * 0.2) * 15;
                    fake = Math.min(canvasHeight * 0.5, Math.max(5, fake));
                    const x = i * (canvasWidth / barCount);
                    const w = (canvasWidth / barCount) * 0.75;
                    ctx.fillStyle = `rgba(255, 140, 0, ${0.6 + Math.sin(time + i) * 0.2})`;
                    ctx.fillRect(x + 2, canvasHeight - fake, w, fake);
                }
                requestAnimationFrame(() => demoVisualization());
            }
        }
        
        // Инициализация
        function init() {
            resizeCanvas();
            
            playStopBtn.addEventListener('click', togglePlayStop);
            
            // Загружаем поток
            setTimeout(() => {
                loadRadioStream(RADIO_STREAM_URL);
            }, 500);
            
            demoVisualization();
        }
        
        init();
        
        window.addEventListener('beforeunload', () => {
            if (audioElement) audioElement.pause();
            if (audioContext) audioContext.close();
        });
        
        console.log('🎵 RADIO DJ BOGA плеер запущен | Логотип большой, плеер без обводки');
    </script>
</body>
</html>
