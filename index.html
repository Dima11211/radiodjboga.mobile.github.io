<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RADIO DJ BOGA | Интернет Радио</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L3147Z3JSN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-L3147Z3JSN');

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #f0f2f5 100%);
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 20px 20px 20px;
            position: relative;
        }

        .logo-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 5px 0 0 0;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
        }

        .custom-player {
            background: #03fff7;
            border-radius: 0;
            padding: 0;
            margin-top: 15px;
            margin-bottom: 20px;
            box-shadow: 0 12px 28px rgba(3, 255, 247, 0.2);
            overflow: hidden;
        }

        .button-container {
            display: flex;
            justify-content: center;
            padding: 4px 0 4px 0;
            background: #03fff7;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
        }

        .play-stop-btn {
            background: linear-gradient(135deg, #8b0000, #5a0000);
            border: none;
            width: 180px;
            padding: 10px 0;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 6px 16px rgba(139, 0, 0, 0.4);
            gap: 10px;
            letter-spacing: 1px;
        }

        .play-stop-btn:active {
            transform: scale(0.97);
        }

        .visualizer-container {
            background: rgba(0, 0, 0, 0.15);
            padding: 20px 16px 24px 16px;
        }

        canvas {
            width: 100%;
            height: 180px;
            display: block;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .status-text {
            text-align: center;
            margin-top: 15px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .mobile-container {
                padding: 8px 16px 16px 16px;
            }
            .play-stop-btn {
                width: 160px;
                padding: 9px 0;
                font-size: 1.2rem;
            }
            canvas {
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <img src="img/20260225_2221_image.png" alt="RADIO DJ BOGA" class="logo-image">

        <div class="custom-player">
            <div class="button-container">
                <button class="play-stop-btn" id="playStopBtn">▶ PLAY</button>
            </div>
            <div class="visualizer-container">
                <canvas id="visualizerCanvas" width="800" height="180"></canvas>
            </div>
        </div>

        <div class="status-text" id="statusText">Готов к воспроизведению</div>
        <main class="content"></main>
    </div>

    <script>
        // ============================================================
        // НАСТРОЙКИ ВАШЕГО РАДИО ВЕЩАНИЯ
        // ============================================================
        const RADIO_STREAM_URL = "https://radio.radiodjboga.online/stream";
        // ============================================================

        const playStopBtn = document.getElementById('playStopBtn');
        const statusSpan = document.getElementById('statusText');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        
        let audioElement = null;
        let audioContext = null;
        let sourceNode = null;
        let analyserNode = null;
        let gainNode = null;
        let animationId = null;
        let isPlaying = false;
        
        let dataArray = null;
        let canvasWidth = 800;
        let canvasHeight = 180;
        
        // Храним предыдущие значения для плавности
        let prevValues = [];
        
        function updateStatus(msg, isError = false) {
            statusSpan.textContent = msg;
            statusSpan.style.color = isError ? '#e74c3c' : '#1a1a2e';
            console.log(msg);
        }
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const width = container.clientWidth - 32;
            canvas.width = width;
            canvas.height = 180;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
            if (analyserNode) {
                const bufferLength = analyserNode.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                prevValues = new Array(bufferLength).fill(0);
            }
        }
        
        window.addEventListener('resize', () => setTimeout(resizeCanvas, 100));
        resizeCanvas();
        
        async function initWebAudioForRadio() {
            if (!audioElement) return false;
            
            if (audioContext && audioContext.state !== 'closed') {
                if (animationId) cancelAnimationFrame(animationId);
                try { await audioContext.close(); } catch(e) {}
            }
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioContext.createMediaElementSource(audioElement);
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 256;
                analyserNode.smoothingTimeConstant = 0.7;
                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.8;
                
                sourceNode.connect(analyserNode);
                analyserNode.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                const bufferLength = analyserNode.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                prevValues = new Array(bufferLength).fill(0);
                startVisualization();
                return true;
            } catch (error) {
                console.error("Web Audio ошибка:", error);
                return false;
            }
        }
        
        // Функция для получения цвета в зависимости от высоты столбца
        // 0 = низ (зеленый), 1 = верх (красный), через всю радугу
        function getColorForHeight(percent, isPeak = false) {
            // percent: 0 = низ столбца, 1 = верх столбца
            // Цвета радуги: зеленый -> желтый -> оранжевый -> красный
            let hue;
            
            if (percent < 0.25) {
                // Зеленый -> Желто-зеленый
                hue = 120 - (percent / 0.25) * 60;
            } else if (percent < 0.5) {
                // Желто-зеленый -> Желтый
                hue = 60 - ((percent - 0.25) / 0.25) * 30;
            } else if (percent < 0.75) {
                // Желтый -> Оранжевый
                hue = 30 - ((percent - 0.5) / 0.25) * 15;
            } else {
                // Оранжевый -> Красный
                hue = 15 - ((percent - 0.75) / 0.25) * 15;
            }
            
            // Корректируем, чтобы красный был в самом верху
            if (percent > 0.9) {
                hue = 0;
            }
            
            let sat = 90;
            let light = 55;
            
            // Пики делаем ярче
            if (isPeak && percent > 0.8) {
                light = 70;
                sat = 100;
            }
            
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        }
        
        function startVisualization() {
            if (animationId) cancelAnimationFrame(animationId);
            
            function draw() {
                if (!analyserNode || !ctx) {
                    animationId = requestAnimationFrame(draw);
                    return;
                }
                if (dataArray) analyserNode.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                
                const barCount = analyserNode.frequencyBinCount;
                const halfBarCount = barCount / 2;
                
                // Находим максимальное значение
                let maxValue = 0;
                for (let i = 0; i < barCount; i++) {
                    if (dataArray[i] > maxValue) maxValue = dataArray[i];
                }
                if (maxValue < 1) maxValue = 255;
                
                // Создаем массив для отображения "ёлочкой"
                const displayBars = [];
                for (let i = 0; i < barCount; i++) {
                    let distanceFromCenter = Math.abs(i - halfBarCount) / halfBarCount;
                    let frequencyWeight = 1 - distanceFromCenter;
                    let boostedValue = dataArray[i] * (0.5 + frequencyWeight * 0.8);
                    displayBars[i] = Math.min(255, boostedValue);
                }
                
                // Рисуем столбцы
                for (let i = 0; i < barCount; i++) {
                    let value = displayBars[i] || 0;
                    let percent = value / maxValue;
                    let barHeight = Math.max(4, percent * canvasHeight * 0.85);
                    
                    // Плавное изменение высоты
                    if (prevValues[i]) {
                        barHeight = prevValues[i] * 0.6 + barHeight * 0.4;
                    }
                    prevValues[i] = barHeight;
                    
                    // Толщина столбцов
                    const x = i * (canvasWidth / barCount);
                    const w = Math.max(6, (canvasWidth / barCount) * 1.6);
                    
                    // Пик ли это
                    const isPeak = value > 180;
                    
                    // 🎨 РИСУЕМ СТОЛБЕЦ С ГРАДИЕНТОМ ОТ ЗЕЛЕНОГО ДО КРАСНОГО
                    // Создаем вертикальный градиент для каждого столбца
                    const gradient = ctx.createLinearGradient(x, canvasHeight - barHeight, x, canvasHeight);
                    
                    // Добавляем цвета по всей высоте столбца
                    // Низ (0) = зеленый, середина = желтый/оранжевый, верх = красный
                    gradient.addColorStop(0, getColorForHeight(0, false));      // Низ - зеленый
                    gradient.addColorStop(0.15, getColorForHeight(0.15, false));
                    gradient.addColorStop(0.3, getColorForHeight(0.3, false));   // Желто-зеленый
                    gradient.addColorStop(0.45, getColorForHeight(0.45, false));  // Желтый
                    gradient.addColorStop(0.6, getColorForHeight(0.6, false));    // Оранжевый
                    gradient.addColorStop(0.75, getColorForHeight(0.75, false));
                    gradient.addColorStop(0.9, getColorForHeight(0.9, false));
                    gradient.addColorStop(1, getColorForHeight(1, isPeak));       // Верх - красный
                    
                    ctx.fillStyle = gradient;
                    ctx.shadowBlur = isPeak ? 10 : 4;
                    ctx.shadowColor = isPeak ? '#ff3300' : '#ff8c00';
                    
                    // Рисуем столбец
                    ctx.fillRect(x + 1, canvasHeight - barHeight, w - 1, barHeight);
                    
                    // Добавляем свечение на вершине для пиков
                    if (isPeak && barHeight > 15) {
                        ctx.fillStyle = `rgba(255, 50, 50, 0.6)`;
                        ctx.fillRect(x + 1, canvasHeight - barHeight - 2, w - 1, 4);
                    }
                }
                ctx.shadowBlur = 0;
                
                animationId = requestAnimationFrame(draw);
            }
            draw();
        }
        
        async function startPlayback() {
            try {
                updateStatus('Подключение к потоку...');
                
                if (audioElement) {
                    audioElement.pause();
                    audioElement.src = '';
                    audioElement = null;
                }
                if (audioContext && audioContext.state !== 'closed') {
                    if (animationId) cancelAnimationFrame(animationId);
                    try { await audioContext.close(); } catch(e) {}
                    audioContext = null;
                    analyserNode = null;
                }
                
                const newAudio = new Audio();
                newAudio.crossOrigin = 'anonymous';
                newAudio.src = RADIO_STREAM_URL;
                newAudio.preload = 'auto';
                
                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('Таймаут загрузки')), 15000);
                    newAudio.addEventListener('canplay', () => {
                        clearTimeout(timeout);
                        resolve();
                    }, { once: true });
                    newAudio.addEventListener('error', () => {
                        clearTimeout(timeout);
                        reject(new Error('Ошибка загрузки потока'));
                    }, { once: true });
                    newAudio.load();
                });
                
                audioElement = newAudio;
                const webAudioOk = await initWebAudioForRadio();
                if (!webAudioOk) throw new Error('Не удалось инициализировать аудио');
                
                if (audioContext && audioContext.state === 'suspended') await audioContext.resume();
                await audioElement.play();
                isPlaying = true;
                playStopBtn.innerHTML = '⏹ STOP';
                updateStatus('▶ В эфире');
            } catch (err) {
                console.error(err);
                updateStatus('Ошибка: ' + err.message, true);
                isPlaying = false;
                playStopBtn.innerHTML = '▶ PLAY';
                if (audioElement) {
                    audioElement.pause();
                    audioElement.src = '';
                    audioElement = null;
                }
            }
        }
        
        function stopPlayback() {
            if (audioElement) audioElement.pause();
            isPlaying = false;
            playStopBtn.innerHTML = '▶ PLAY';
            updateStatus('Остановлено');
        }
        
        async function togglePlayStop() {
            if (isPlaying) {
                stopPlayback();
            } else {
                await startPlayback();
            }
        }
        
        // Демо-режим визуализации с градиентом
        let demoAnimationId = null;
        function demoVisualization() {
            if (demoAnimationId) cancelAnimationFrame(demoAnimationId);
            
            function drawDemo() {
                if (analyserNode && audioElement && audioElement.src && isPlaying) {
                    if (demoAnimationId) cancelAnimationFrame(demoAnimationId);
                    return;
                }
                
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                const barCount = 48;
                const halfBarCount = barCount / 2;
                const time = Date.now() * 0.005;
                
                for (let i = 0; i < barCount; i++) {
                    let distanceFromCenter = Math.abs(i - halfBarCount) / halfBarCount;
                    let boostFactor = Math.cos(distanceFromCenter * Math.PI / 2);
                    
                    let fake = 20 + Math.sin(time + i * 0.2) * 15;
                    fake = fake * (0.3 + boostFactor * 0.9);
                    fake = Math.min(canvasHeight * 0.6, Math.max(5, fake));
                    
                    const x = i * (canvasWidth / barCount);
                    const w = Math.max(6, (canvasWidth / barCount) * 1.6);
                    
                    // Градиент для демо-режима
                    const gradient = ctx.createLinearGradient(x, canvasHeight - fake, x, canvasHeight);
                    gradient.addColorStop(0, '#00ff00');      // Зеленый низ
                    gradient.addColorStop(0.3, '#ffff00');    // Желтый
                    gradient.addColorStop(0.6, '#ff8800');    // Оранжевый
                    gradient.addColorStop(1, '#ff0000');      // Красный верх
                    
                    ctx.fillStyle = gradient;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = '#ff8c00';
                    ctx.fillRect(x + 1, canvasHeight - fake, w - 1, fake);
                }
                ctx.shadowBlur = 0;
                
                demoAnimationId = requestAnimationFrame(drawDemo);
            }
            drawDemo();
        }
        
        playStopBtn.addEventListener('click', togglePlayStop);
        demoVisualization();
        updateStatus('Нажмите PLAY');
        
        window.addEventListener('beforeunload', () => {
            if (audioElement) audioElement.pause();
            if (audioContext) audioContext.close();
            if (animationId) cancelAnimationFrame(animationId);
            if (demoAnimationId) cancelAnimationFrame(demoAnimationId);
        });
    </script>
</body>
</html>
