<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            flex: 1;
        }

        /* Логотип — фиксированный отступ сверху */
        .logo-image {
            width: 100%;
            max-width: 330px;
            height: auto;
            display: block;
            margin: 10px auto 0;
            position: relative;
            z-index: 10;
        }

        /* === Плеер — точная настройка под каждый экран === */
        .player-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
        }

        /* БАЗА: iPhone SE и подобные маленькие (высота ~670px) */
        @media (max-height: 700px) {
            .player-wrapper {
                margin-top: -130px;  /* Поднято ещё на 10px от предыдущего */
            }
        }

        /* Samsung A35, средние телефоны (высота ~800–900px) */
        @media (min-height: 701px) and (max-height: 950px) {
            .player-wrapper {
                margin-top: -160px;  /* Поднято ещё на 10px */
            }
        }

        /* Большие телефоны/планшеты */
        @media (min-height: 951px) {
            .player-wrapper {
                margin-top: -190px;  /* Поднято ещё на 10px */
            }
        }

        /* Плеер без фона */
        .cstrEmbed iframe {
            width: 100% !important;
            border: none !important;
            background: transparent;
        }

        /* Скрываем лишнее */
        .player-poster, .poster_container, #albumart, .cover-art-wrapper {
            display: none !important;
        }

        .content {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <img src="img/20260225_2221_image.png" 
             alt="RADIO DJ BOGA" 
             class="logo-image">

        <div class="player-wrapper">
            <div data-type="newStreamPlayer"
                 data-publicToken="7cb75f5e-9e0a-4716-b67f-7e4940ba6987"
                 data-theme="light"
                 data-color="e81e4d"
                 data-channelId=""
                 data-rendered="false"
                 class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
        </div>

        <main class="content"></main>
    </div>

    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
</body>
</html>
